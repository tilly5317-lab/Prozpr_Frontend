# Cache policy for the SPA served from /var/www/html by the host nginx.
#
# Include this inside the prozpr server block:
#     include /etc/nginx/snippets/prozpr-spa-cache.conf;
#
# WHY THIS EXISTS
# ---------------
# The host nginx sends no Cache-Control on index.html. With only ETag and
# Last-Modified to go on, browsers apply HEURISTIC caching — roughly 10% of the
# document's age — and reuse the shell without revalidating. index.html is the
# one file that names the hashed bundle, so a stale shell pins a returning user
# to the previous build: the deploy lands, the server is correct, and the user
# still runs the old app. That is exactly how the forgot-PIN screen could ship
# and stay invisible.
#
# The repo's own nginx.conf already gets this right, but it listens on 8080 with
# root /usr/share/nginx/html — a container layout that is not in the serving
# path for prozpr.in. This file is the host equivalent.

# The shell: always revalidate. `no-cache` does NOT mean "do not store" — the
# browser keeps the copy and revalidates, so an unchanged shell still comes back
# as a 304 with no body. `no-store` would be wasteful here.
#
# An exact-match location is enough to cover `/` as well: the SPA fallback
# `try_files $uri $uri/ /index.html` ends in a URI, which nginx serves by
# INTERNAL REDIRECT, and that re-runs location matching — so a request for `/`
# lands here and picks up this header. Deep links like /chat resolve the same
# way. Verify with:  curl -sI https://prozpr.in/ | grep -i cache-control
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Hashed build output: the filename changes whenever the bytes change, so these
# can be cached hard and forever. `immutable` also stops the revalidation
# request browsers otherwise send on reload.
location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
